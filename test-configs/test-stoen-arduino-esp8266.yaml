# Polish STOEN dialect on ESP8266 (Arduino). The STOEN receive path has no
# ESP32-only dependencies, so it has to build here too; debug_udp_target is
# the one option that is not available on this target. RAM is the real limit
# here, not the code size - see "RAM on ESP8266" in the README.
substitutions:
  device_name: test-stoen-esp8266

esphome:
  name: ${device_name}
  name_add_mac_suffix: false

esp8266:
  board: d1_mini
  framework:
    version: 3.1.2

wifi:
  ssid: "test"
  password: "test12345678"

logger:
  # VERY_VERBOSE so that every ESP_LOGx in the component is actually
  # compiled: ESPHome drops log calls above the configured level, and a
  # format string that is never compiled is never checked either.
  level: VERY_VERBOSE

api:
  encryption:
    key: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="

ota:
  platform: esphome

uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: D7
  rx_buffer_size: 1700

external_components:
  - source:
      type: local
      path: ../components
    components: [ dsmr_custom ]
    refresh: 0s

dsmr_custom:
  id: dsmr_hub
  uart_id: uart_bus
  max_telegram_length: 1700
  crc_check: false
  method: poland_stoen
  decryption_key: "AABBCCDDEEFF00112233445566778899"

  custom_obis_sensors:
    - code: "1-0:1.8.0"
      name: "Total Energy Import"
      type: sensor
      unit_of_measurement: "kWh"
      accuracy_decimals: 3
      device_class: energy
      state_class: total_increasing

text_sensor:
  - platform: dsmr_custom
    dsmr_custom_hub_id: dsmr_hub
    identification:
      name: "P1 Telegram Header"
